name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/CV-Maker.apk
          echo "APK generated successfully:"
          ls -lh release-assets/CV-Maker.apk

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=CV Maker ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          body: |
            ### 📱 CV Maker — Android APK Release
            
            Welcome to the official Android APK release for **CV Maker**!
            
            #### Features:
            - **Automatic CV Builder**: 12 professional templates with bilingual English & Somali support.
            - **Canva-Style Design Studio**: Freeform drag-and-drop editor, custom shapes (circle, rounded, hexagon, badge), elements, and typography.
            - **Instant PDF Export**: High-resolution print-ready A4 export directly on your device.
            - **Cloud & Local Storage**: Auto-save drafts and sync seamlessly with Google Sign-In & Firebase.
            
            #### 📥 Download & Installation:
            Download **`CV-Maker.apk`** below to install directly on your Android phone.
          files: release-assets/CV-Maker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
