name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=180000"
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/CV-Maker.apk
          echo "APK generated successfully:"
          ls -lh release-assets/CV-Maker.apk

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.1.2"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=CV Maker ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          body: |
            ### 📱 CV Maker — Android APK Release

            Ku soo dhowow nooca rasmiga ah ee **CV Maker Android APK**!

            #### ✨ Astaamaha ugu muhiimsan (Features):
            - **Automatic CV Builder**: 12 templates xirfadeed oo taageeraya af-Soomaali iyo English.
            - **Canva-Style Design Studio**: Wax ka beddel xor ah (drag & drop), qaabab (circle, hexagon, badges), sawirro & qoraallo.
            - **PDF Export Toos ah**: Soo degso CV-gaaga oo PDF tayo sare leh (A4 print-ready).
            - **Cloud & Local Storage**: Kaydi CV-yadaada taleefankaaga ama ku xir Google/Firebase.

            #### 📥 Sida loo rakibo (Download & Install):
            Hoos ka soo degso feylka **`CV-Maker.apk`**, kadibna ku fur taleefankaaga Android si aad u rakibatid (Install).
          files: release-assets/CV-Maker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
